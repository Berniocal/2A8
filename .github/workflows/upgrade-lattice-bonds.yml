name: Upgrade lattice models

on:
  push:
    paths:
      - '.github/workflows/upgrade-lattice-bonds.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upgrade 3D lattice viewer
        run: |
          python -c "import base64;exec(base64.b64decode(' '))"
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vlastnosti.html
          git diff --cached --quiet || git commit -m "Upgrade 3D lattice models with bonds"
          git push
