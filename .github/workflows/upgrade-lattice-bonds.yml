name: Fix sugar lattice and perspective

on:
  push:
    paths:
      - '.github/workflows/upgrade-lattice-bonds.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix sugar crystal and 3D depth
        run: python patch_sugar_perspective.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vlastnosti.html
          git diff --cached --quiet || git commit -m "Fix sugar lattice and 3D perspective"
          git push
