name: Fix mobile lattice

on:
  push:
    paths:
      - '.github/workflows/fix-mobile-lattice.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix mobile 3D lattice
        shell: python
        run: |
          from pathlib import Path

          p = Path('vlastnosti.html')
          t = p.read_text(encoding='utf-8')

          marker = "let l3rx=-20,l3ry=30,l3scale=1,l3drag=false,l3x=0,l3y=0;"
          explicit = "const lattice3dWorld=document.getElementById('lattice3d-world');\nconst lattice3dInfo=document.getElementById('lattice3d-info');\n"
          if explicit not in t:
              t = t.replace(marker, explicit + marker, 1)

          hook = "document.querySelector('[data-tab=\"krystaly\"]')?.addEventListener('click',()=>setTimeout(()=>showLattice3D('salt'),60));"
          if hook not in t:
              target = "setTimeout(()=>{const st=document.getElementById('lattice3d-stage');"
              t = t.replace(target, hook + "\n" + target, 1)

          p.write_text(t, encoding='utf-8')

      - name: Commit fix and remove one-off workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/fix-mobile-lattice.yml
          git add -A
          git diff --cached --quiet || git commit -m "Fix 3D lattice on mobile"
          git push
